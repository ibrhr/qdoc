name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Test Windows release build
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          $gopath = go env GOPATH
          & $gopath\bin\goversioninfo -o resource_windows.syso versioninfo.json
          go build -o dist\qdoc.exe .
