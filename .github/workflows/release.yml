name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -s -w" \
            -o dist/qdoc${EXT} \
            .

      - name: Smoke test (linux)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./dist/qdoc --version | grep -q "$VERSION"

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar czf qdoc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz qdoc

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip qdoc_windows_${{ matrix.goarch }}.zip qdoc.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdoc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set npm version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
