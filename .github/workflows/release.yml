name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  build-unix:
    needs: [test-linux]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -s -w" \
            -o dist/qdoc \
            .

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./dist/qdoc --version | grep -q "$VERSION"

      - name: Package
        run: |
          cd dist
          tar czf qdoc_linux_${{ matrix.goarch }}.tar.gz qdoc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdoc-linux-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz

  build-macos:
    needs: [test-macos]
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -s -w" \
            -o dist/qdoc \
            .

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./dist/qdoc --version | grep -q "$VERSION"

      - name: Package
        run: |
          cd dist
          tar czf qdoc_darwin_${{ matrix.goarch }}.tar.gz qdoc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdoc-darwin-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz

  build-windows:
    needs: [test-windows]
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          $gopath = go env GOPATH
          $VERSION = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $COMMIT = git rev-parse --short HEAD
          & $gopath\bin\goversioninfo -product-version="$VERSION" -file-version="$VERSION" -arch=${{ matrix.goarch }} -o resource_windows.syso versioninfo.json
          go build `
            -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT -s -w" `
            -o dist/qdoc.exe `
            .

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: |
          $VERSION = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $out = & ./dist/qdoc.exe --version
          if ($out -notmatch $VERSION) {
            Write-Error "Version mismatch: expected $VERSION, got $out"
            exit 1
          }
          Write-Host "Smoke test passed: $out"

      - name: Package
        run: |
          $ARCH = "${{ matrix.goarch }}"
          cd dist
          Compress-Archive -Path qdoc.exe -DestinationPath qdoc_windows_$ARCH.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdoc-windows-${{ matrix.goarch }}
          path: |
            dist/*.zip

  release:
    needs: [build-unix, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set npm version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
