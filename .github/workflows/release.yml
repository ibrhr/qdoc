name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -s -w" \
            -o dist/qdoc_${GOOS}_${GOARCH}${EXT} \
            .

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar czf qdoc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz qdoc_${{ matrix.goos }}_${{ matrix.goarch }}

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip qdoc_windows_${{ matrix.goarch }}.zip qdoc_windows_${{ matrix.goarch }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdoc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
